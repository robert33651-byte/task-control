<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Demo — Առաջադրանքների վերահսկում</title>

<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2457d6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a2433; --muted:#6b7686; --line:#e3e8ef;
    --accent:#2457d6; --accent-soft:#e8eefc;
    --green:#1a7f4e; --green-soft:#e3f4ea;
    --orange:#b05c10; --orange-soft:#fdf0df;
    --red:#b3261e; --red-soft:#fbe9e7;
    --blue:#1762a8; --blue-soft:#e4f0fa;
    --grey:#5b6472; --grey-soft:#eceff3;
    --r:12px; --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top)}
  .wrap{max-width:860px;margin:0 auto;padding:20px 14px 64px}
  header.app{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  header.app h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .hdr-right{display:flex;align-items:center;gap:8px;position:relative}
  .role-badge{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .icon-btn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
  .icon-btn:hover{background:var(--grey-soft)}
  .icon-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;border-radius:999px;padding:0 4px;display:none}
  .notif-panel{position:absolute;right:0;top:46px;width:min(340px,90vw);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 36px rgba(16,24,40,.18);z-index:60;display:none;overflow:hidden}
  .notif-panel.open{display:block}
  .notif-panel h3{font-size:13.5px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
  .notif-list{max-height:320px;overflow:auto}
  .notif-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .notif-item:last-child{border-bottom:none}
  .notif-item.unread{color:var(--ink);font-weight:500;background:var(--accent-soft)}
  .notif-item .when{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .notif-empty{padding:22px 14px;text-align:center;font-size:13px;color:var(--muted)}

  .center-card{max-width:400px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
  .center-card h2{font-size:18px;margin-bottom:4px;text-align:center}
  .center-card .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
  .center-card img.qr{display:block;margin:0 auto 10px;width:190px;height:190px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .secret-code{font-family:monospace;font-size:12.5px;background:var(--grey-soft);border-radius:8px;padding:8px 10px;word-break:break-all;text-align:center;margin-bottom:12px}
  .err{background:var(--red-soft);color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}

  .banner{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:10px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .panel h2{font-size:15px;font-weight:600;margin-bottom:12px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .fld textarea{min-height:64px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(.95)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .btn-red{background:var(--red-soft);color:var(--red)}
  .btn-ghost{background:var(--grey-soft);color:var(--ink)}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn-full{width:100%}

  .task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .task-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer}
  .task-head:hover{background:#fafbfd}
  .task-title{font-weight:600;font-size:15px}
  .task-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .task-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .chip.new{background:var(--grey-soft);color:var(--grey)}
  .chip.viewed{background:var(--blue-soft);color:var(--blue)}
  .chip.done{background:var(--orange-soft);color:var(--orange)}
  .chip.accepted{background:var(--green-soft);color:var(--green)}
  .chip.returned{background:var(--red-soft);color:var(--red)}
  .seen{font-size:11.5px;color:var(--muted);text-align:right;max-width:200px}
  .seen .eye{color:var(--blue)}
  .task-body{padding:0 16px 16px;border-top:1px dashed var(--line)}
  .task-desc{white-space:pre-wrap;color:var(--ink);font-size:14px;padding:12px 0 4px}
  .meta-line{font-size:12.5px;color:var(--muted);margin:6px 0}
  .file-pill{display:inline-flex;align-items:center;gap:8px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0;max-width:100%;flex-wrap:wrap}
  .file-pill b{word-break:break-all}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .return-note{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}
  .upload-zone{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:13.5px;color:var(--muted);margin-top:10px;cursor:pointer}
  .upload-zone:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .section-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
  .toast.show{opacity:1}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .count-card{flex:1;min-width:104px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
  .count-card .n{font-size:20px;font-weight:700}
  .count-card .t{font-size:12px;color:var(--muted)}
  dialog{border:none;border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;width:min(430px,92vw)}
  dialog::backdrop{background:rgba(16,24,40,.45)}
  dialog h3{font-size:16px;margin-bottom:12px}
  .emp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .emp-row:last-child{border-bottom:none}
  .emp-name{font-weight:600;font-size:14px}
  .emp-mail{font-size:12px;color:var(--muted)}
  .emp-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tag.boss{background:var(--orange-soft);color:var(--orange)}
  .tag.worker{background:var(--blue-soft);color:var(--blue)}
  .tag.off{background:var(--red-soft);color:var(--red)}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--grey-soft);border:1px solid var(--line)}
  .pin-dots i.on{background:var(--accent);border-color:var(--accent)}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
  .pin-pad button{font-size:20px;font-weight:600;padding:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
  .pin-pad button:active{background:var(--accent-soft)}
  .link-btn{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .settings-row:last-child{border-bottom:none}

  /* ----- чат задачи ----- */
  .chat{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .chat-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .chat-list{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:#eef2f7;border-radius:12px}
  .chat-empty{color:var(--muted);font-size:13px;text-align:center;padding:10px}
  .msg{display:flex;flex-direction:column;max-width:82%}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.they{align-self:flex-start;align-items:flex-start}
  .mname{font-size:11.5px;font-weight:600;color:var(--accent);margin:0 6px 2px}
  .bubble{background:#fff;border-radius:12px;padding:7px 10px 4px;box-shadow:var(--shadow);min-width:70px}
  .msg.me .bubble{background:#dcf1d6}
  .mtext{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .mtime{font-size:10.5px;color:var(--muted);text-align:right;margin-top:2px}
  .vmsg{display:flex;align-items:center;gap:8px;min-width:210px}
  .vplay{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#1c274c;font-size:20px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .vplay img{width:34px;height:34px;display:block}
  .wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
  .wave i{flex:1;min-width:2px;border-radius:2px;background:#b8c2d1;display:block}
  .wave i.on{background:var(--accent)}
  .msg.me .wave i.on{background:#2e9e5b}
  .vtime{flex:none;font-size:11.5px;color:var(--muted);min-width:34px;text-align:right}
  .composer{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
  .chat-input{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font:inherit;max-height:110px;background:#fff}
  .chat-input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .cbtn{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  .cbtn.mic{background:var(--grey-soft);padding:0;display:flex;align-items:center;justify-content:center}
  .cbtn.mic img{width:26px;height:auto;display:block}
  .cbtn.ghost{background:var(--grey-soft);color:var(--grey)}
  .cbtn:disabled{opacity:.45;cursor:default}
  .recbar{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:5px 12px;min-height:42px}
  .rec-dot{width:10px;height:10px;border-radius:50%;background:#e03131;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .rec-time{font-variant-numeric:tabular-nums;font-size:14px;min-width:38px}
  .rec-live{flex:1;display:flex;align-items:center;gap:2px;height:28px;overflow:hidden;justify-content:flex-end}
  .rec-live i{width:3px;flex:none;border-radius:2px;background:#e03131;display:block}
  .chat-closed{color:var(--muted);font-size:13px;margin-top:8px}
  .vico{height:1.2em;width:auto;vertical-align:-.25em;margin-right:3px}
  .cnt-badge{font-size:12px;color:var(--muted);margin-left:6px}

#demoBar{position:sticky;top:0;z-index:999;background:#1a2433;color:#fff;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:13px system-ui}
#demoBar b{background:#f5a623;color:#1a2433;padding:2px 8px;border-radius:6px;margin-right:4px}
#demoBar button{background:#34435a;color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
#demoBar button.on{background:#2457d6}
body.phone{max-width:400px;margin:0 auto;box-shadow:0 0 0 1px #ccc}
</style>
</head>
<body>
<div class="wrap">
  <header class="app" id="appHeader" style="display:none">
    <h1>📋 Առաջադրանքներ</h1>
    <div class="hdr-right">
      <span class="role-badge" id="roleBadge"></span>
      <button class="icon-btn" id="bellBtn" title="Ծանուցումներ">🔔<span class="badge" id="bellBadge"></span></button>
      <button class="icon-btn" id="setBtn" title="Կարգավորումներ">⚙️</button>
      <div class="notif-panel" id="notifPanel">
        <h3>Ծանուցումներ</h3>
        <div class="notif-list" id="notifList"></div>
      </div>
    </div>
  </header>
  <div id="screen"></div>
</div>

<dialog id="returnDlg">
  <h3>Վերադարձնել լրամշակման</h3>
  <div class="fld"><label>Մեկնաբանություն հաշվապահի համար</label>
    <textarea id="returnComment" placeholder="Ի՞նչ է պետք ուղղել…"></textarea></div>
  <div class="actions" style="justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" id="returnCancel">Չեղարկել</button>
    <button class="btn btn-red btn-sm" id="returnOk">Վերադարձնել</button>
  </div>
</dialog>

<dialog id="pwDlg">
  <h3 id="pwDlgTitle">Նոր գաղտնաբառ</h3>
  <div class="err" id="pwErr"></div>
  <div class="fld"><label>Նոր գաղտնաբառ (առնվազն 8 նիշ)</label>
    <input type="password" id="pwNew" autocomplete="new-password"></div>
  <div class="actions" style="justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" id="pwCancel">Չեղարկել</button>
    <button class="btn btn-primary btn-sm" id="pwOk">Պահպանել</button>
  </div>
</dialog>

<dialog id="setDlg">
  <h3>Կարգավորումներ</h3>
  <div class="settings-row">
    <div><b style="font-size:14px">Push ծանուցումներ</b><div style="font-size:12px;color:var(--muted)">այս սարքի վրա</div></div>
    <button class="btn btn-ghost btn-sm" id="pushToggle">…</button>
  </div>
  <div class="settings-row">
    <div><b style="font-size:14px">Գաղտնաբառ</b></div>
    <button class="btn btn-ghost btn-sm" id="changePwBtn">Փոխել</button>
  </div>
  <div class="settings-row" id="pinRow" style="display:none">
    <div><b style="font-size:14px">PIN կոդ</b><div style="font-size:12px;color:var(--muted)">հավելվածը բացելիս</div></div>
    <button class="btn btn-ghost btn-sm" id="changePinBtn">Փոխել</button>
  </div>
  <div class="settings-row">
    <div><b style="font-size:14px">Ելք</b></div>
    <button class="btn btn-red btn-sm" id="logoutBtn">Դուրս գալ</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

// ---------- PIN (локальная блокировка устройства) ----------
function pinKey(){return 'pin_'+(me?me.id:'')}
async function pinHash(pin,salt){
  var data=new TextEncoder().encode(salt+':'+pin);
  var h=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}
function pinStored(){try{return JSON.parse(localStorage.getItem(pinKey())||'null')}catch(e){return null}}
function pinSave(obj){try{localStorage.setItem(pinKey(),JSON.stringify(obj))}catch(e){}}
function pinClear(){try{localStorage.removeItem(pinKey())}catch(e){}}

function showPinScreen(mode,next){ // mode: 'set' | 'enter' | 'change'
  var buf='', firstPin=null;
  function title(){
    if(mode==='set')return firstPin===null?'Ստեղծեք PIN կոդ':'Կրկնեք PIN կոդը';
    if(mode==='change')return firstPin===null?'Նոր PIN կոդ':'Կրկնեք PIN կոդը';
    return 'Մուտքագրեք PIN կոդը';
  }
  function renderPin(){
    var dots='';for(var i=0;i<4;i++)dots+='<i class="'+(i<buf.length?'on':'')+'"></i>';
    screenEl.innerHTML='<div class="center-card"><h2>🔒 '+title()+'</h2>'
      +'<div class="sub">'+(mode==='enter'?'Հավելվածը պաշտպանված է':'4 թվանշան')+'</div>'
      +'<div class="err" id="pinErr"></div>'
      +'<div class="pin-dots">'+dots+'</div>'
      +'<div class="pin-pad" id="pinPad"></div>'
      +(mode==='enter'?'<div style="text-align:center;margin-top:14px"><button class="link-btn" id="pinForgot">Մոռացե՞լ եք PIN-ը — դուրս գալ</button></div>':'')
      +'</div>';
    var pad=$('#pinPad');
    [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(function(k){
      var b=document.createElement('button');
      b.textContent=k===''?' ':String(k);
      if(k==='')b.style.visibility='hidden';
      b.addEventListener('click',function(){
        if(k==='⌫'){buf=buf.slice(0,-1);renderPin();return}
        if(buf.length>=4)return;
        buf+=String(k);
        if(buf.length===4)setTimeout(submit,120);
        renderPin();
      });
      pad.appendChild(b);
    });
    var f=$('#pinForgot');
    if(f)f.addEventListener('click',function(){pinClear();doLogout()});
  }
  async function submit(){
    if(mode==='set'||mode==='change'){
      if(firstPin===null){firstPin=buf;buf='';renderPin();return}
      if(firstPin!==buf){firstPin=null;buf='';renderPin();showErr('#pinErr','Չհամընկավ, փորձեք նորից');return}
      var salt=Math.random().toString(36).slice(2,10);
      pinSave({salt:salt,hash:await pinHash(buf,salt)});
      next();
      return;
    }
    var st=pinStored();
    if(!st){next();return}
    if(await pinHash(buf,st.salt)===st.hash){next();return}
    buf='';renderPin();showErr('#pinErr','Սխալ PIN');
  }
  renderPin();
}

// ---------- 2FA (Google Authenticator) ----------
async function ensureAal2(){
  var lv=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(lv.error)throw lv.error;
  if(lv.data.currentLevel==='aal2')return true;
  var f=await sb.auth.mfa.listFactors();
  if(f.error)throw f.error;
  var verified=(f.data.totp||[]).filter(function(x){return x.status==='verified'});
  if(verified.length)return await mfaVerifyScreen(verified[0].id);
  // чистим незавершённые попытки
  var all=f.data.all||[];
  for(var i=0;i<all.length;i++){
    if(all[i].status!=='verified'){try{await sb.auth.mfa.unenroll({factorId:all[i].id})}catch(e){}}
  }
  return await mfaEnrollScreen();
}
function mfaEnrollScreen(){
  return new Promise(async function(resolve){
    var en=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Authenticator'});
    if(en.error){showLogin('Չհաջողվեց միացնել 2FA․ '+en.error.message);resolve(false);return}
    var qr=en.data.totp.qr_code||'';

    screenEl.innerHTML='<div class="center-card"><h2>Պաշտպանություն՝ Google Authenticator</h2>'
      +'<div class="sub">1․ Բացեք Google Authenticator հավելվածը հեռախոսում<br>2․ Սկանավորեք QR կոդը<br>3․ Մուտքագրեք 6-նիշ կոդը</div>'
      +'<img class="qr" src="'+qr+'" alt="QR">'
      +'<div class="secret-code">'+esc(en.data.totp.secret||'')+'</div>'
      +'<div class="err" id="mfaErr"></div>'
      +'<div class="fld"><label>Կոդը հավելվածից</label><input type="text" id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>'
      +'<button class="btn btn-primary btn-full" id="mfaBtn">Հաստատել</button></div>';
    var go=async function(){
      var code=$('#mfaCode').value.trim();
      if(code.length<6){showErr('#mfaErr','Մուտքագրեք 6 թվանշան');return}
      $('#mfaBtn').disabled=true;
      var ch=await sb.auth.mfa.challenge({factorId:en.data.id});
      if(ch.error){$('#mfaBtn').disabled=false;showErr('#mfaErr',ch.error.message);return}
      var v=await sb.auth.mfa.verify({factorId:en.data.id,challengeId:ch.data.id,code:code});
      if(v.error){$('#mfaBtn').disabled=false;showErr('#mfaErr','Սխալ կոդ, փորձեք նորից');return}
      resolve(true);
    };
    $('#mfaBtn').addEventListener('click',go);
    $('#mfaCode').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  });
}

      +'<div style="text-align:center;margin-top:12px"><button class="link-btn" id="mfaBack">Դուրս գալ</button></div></div>';
    $('#mfaBack').addEventListener('click',function(){doLogout()});
    var go=async function(){
      var code=$('#mfaCode').value.trim();
      if(code.length<6){showErr('#mfaErr','Մուտքագրեք 6 թվանշան');return}
      $('#mfaBtn').disabled=true;
      var ch=await sb.auth.mfa.challenge({factorId:factorId});
      if(ch.error){$('#mfaBtn').disabled=false;showErr('#mfaErr',ch.error.message);return}
      var v=await sb.auth.mfa.verify({factorId:factorId,challengeId:ch.data.id,code:code});
      if(v.error){$('#mfaBtn').disabled=false;showErr('#mfaErr','Սխալ կոդ, փորձեք նորից');return}
      resolve(true);
    };
    $('#mfaBtn').addEventListener('click',go);
    setTimeout(function(){var c=$('#mfaCode');if(c)c.focus()},100);
    $('#mfaCode').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  });
}

async function reloadAll(){
  var r=await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('tasks').select('*').order('created_at',{ascending:false}),
    sb.from('task_views').select('*'),
    sb.from('submissions').select('*'),
    sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('task_messages').select('*').order('created_at',{ascending:true})
  ]);
  if(r[0].data)profiles=r[0].data;
  if(r[1].data)tasks=r[1].data;
  if(r[2].data)views=r[2].data;
  if(r[3].data){subs={};r[3].data.forEach(function(s){subs[s.task_id]=s})}
  if(r[4].data)notifs=r[4].data;
  if(r[5]&&r[5].data){msgs={};r[5].data.forEach(function(m){(msgs[m.task_id]=msgs[m.task_id]||[]).push(m)})}
  markVisibleViewed();
  render();
}

var reloadQueued=false;
function queueReload(){
  if(reloadQueued)return;reloadQueued=true;
  setTimeout(function(){reloadQueued=false;reloadAll()},300);
}

function subscribeRealtime(){
  sb.channel('db-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'task_views'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'submissions'},queueReload)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'task_messages'},queueReload)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},function(p){
      var n=p['new'];
      if(n&&n.recipient===me.id){toast('🔔 '+n.title+(n.body?'․ '+n.body:''));beep()}
      queueReload();
    })
    .subscribe();
}

// ---------- push ----------
var swReg=null;
function registerSW(){return;
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;updatePushBtn()}).catch(function(){});
}
function urlB64ToU8(s){
  var pad='='.repeat((4-s.length%4)%4);
  var b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  var a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return a;
}
async function getPushSub(){
  if(!swReg)return null;
  try{return await swReg.pushManager.getSubscription()}catch(e){return null}
}
async function updatePushBtn(){var _b=$('#pushToggle');if(_b){_b.textContent='Միացնել';_b.disabled=false}return;
  var b=$('#pushToggle');if(!b)return;
  if(!('Notification' in window)||!('PushManager' in window)){b.textContent='Չի աջակցվում';b.disabled=true;return}
  var sub=await getPushSub();
  b.textContent=sub?'Անջատել':'Միացնել';
  b.disabled=false;
}
async function togglePush(){toast('Demo․ իրական հավելվածում այստեղ միանում է push-ը');return;
  var b=$('#pushToggle');b.disabled=true;
  try{
    var sub=await getPushSub();
    if(sub){
      await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);
      await sub.unsubscribe();
      toast('Push ծանուցումներն անջատված են');
    }else{
      var perm=await Notification.requestPermission();
      if(perm!=='granted'){toast('Ծանուցումները արգելված են բրաուզերում');b.disabled=false;updatePushBtn();return}
      if(!swReg)swReg=await navigator.serviceWorker.ready;
      sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8(VAPID_PUBLIC_KEY)});
      var j=sub.toJSON();
      var ins=await sb.from('push_subscriptions').upsert({
        user_id:me.id,endpoint:sub.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth
      },{onConflict:'endpoint'});
      if(ins.error){toast('Չհաջողվեց պահպանել բաժանորդագրությունը');await sub.unsubscribe()}
      else toast('Push ծանուցումները միացված են այս սարքի վրա');
    }
  }catch(e){toast('Սխալ push-ի կարգավորման ժամանակ')}
  updatePushBtn();
}

// ---------- derived ----------
function statusOf(t){
  if(t.accepted_at)return 'accepted';
  var s=subs[t.id];
  var ret=t.returned_at?new Date(t.returned_at).getTime():0;
  if(s&&new Date(s.done_at).getTime()>ret)return 'done';
  if(ret)return 'returned';
  return views.some(function(v){return v.task_id===t.id})?'viewed':'new';
}
function chipFor(st,bossSide){
  switch(st){
    case 'accepted':return '<span class="chip accepted">✓ Ընդունված</span>';
    case 'done':return '<span class="chip done">'+(bossSide?'Ստուգման է սպասում':'Ստուգման փուլում')+'</span>';
    case 'returned':return '<span class="chip returned">Վերադարձված</span>';
    case 'viewed':return '<span class="chip viewed">Դիտված</span>';
    default:return '<span class="chip new">'+(bossSide?'Չդիտված':'Նոր')+'</span>';
  }
}
function seenLine(t){
  var vs=views.filter(function(v){return v.task_id===t.id});
  if(!vs.length)return '<span class="seen">— դեռ չի դիտվել</span>';
  var parts=vs.map(function(v){return esc(nameOf(v.user_id))+' ('+fmtDate(v.viewed_at)+')'});
  return '<span class="seen"><span class="eye">👁</span> '+parts.join(', ')+'</span>';
}

var marking={};
function markVisibleViewed(){
  if(!me||me.role!=='worker')return;
  tasks.forEach(function(t){
    if(t.assignee&&t.assignee!==me.id)return;
    if(views.some(function(v){return v.task_id===t.id&&v.user_id===me.id}))return;
    if(marking[t.id])return;
    marking[t.id]=true;
    sb.from('task_views').insert({task_id:t.id,user_id:me.id}).then(function(){});
  });
}

async function markDone(t,btn){
  btn.disabled=true;
  var file=pendingFiles[t.id]||null;
  var rec={task_id:t.id,done_by:me.id,done_at:new Date().toISOString()};
  if(file){
    if(file.size>MAX_FILE){toast('Ֆայլը 50 ՄԲ-ից մեծ է');btn.disabled=false;return}
    btn.textContent='Բեռնում…';
    var safe=file.name.replace(/[^\w.\-()Ա-և ]+/g,'_').slice(0,100);
    var path=t.id+'/'+me.id+'/'+Date.now()+'_'+safe;
    var up=await sb.storage.from('files').upload(path,file,{contentType:file.type||'application/octet-stream'});
    if(up.error){toast('Չհաջողվեց բեռնել ֆայլը');btn.disabled=false;btn.textContent='✓ Նշել որպես կատարված';return}
    rec.file_path=path;rec.file_name=file.name;rec.file_size=file.size;
  }else{
    var prev=subs[t.id];
    if(prev&&prev.file_path){rec.file_path=prev.file_path;rec.file_name=prev.file_name;rec.file_size=prev.file_size}
  }
  var r=await sb.from('submissions').upsert(rec,{onConflict:'task_id'});
  if(r.error){toast('Չհաջողվեց պահպանել');btn.disabled=false;btn.textContent='✓ Նշել որպես կատարված';return}
  delete pendingFiles[t.id];
  toast('Հանձնված է ստուգման');
  queueReload();
}
async function downloadFile(s,btn){
  if(!s||!s.file_path){toast('Ֆայլ չկա');return}
  var old=btn.textContent;btn.disabled=true;btn.textContent='…';
  var r=await sb.storage.from('files').createSignedUrl(s.file_path,120,{download:s.file_name||true});
  btn.disabled=false;btn.textContent=old;
  if(r.error||!r.data){toast('Չհաջողվեց ներբեռնել');return}
  var a=document.createElement('a');a.href=r.data.signedUrl;a.download=s.file_name||'file';
  document.body.appendChild(a);a.click();a.remove();
}
async function acceptTask(t){

async function deleteTask(t){
  var s=subs[t.id];
  var rm=[];if(s&&s.file_path)rm.push(s.file_path);
  (msgs[t.id]||[]).forEach(function(m){if(m.audio_path)rm.push(m.audio_path)});

  var r=await sb.from('tasks').delete().eq('id',t.id);
  if(r.error){toast('Չհաջողվեց ջնջել');return}
  toast('Ջնջված է');queueReload();
}

// --- запись ---
var rec=null;
async function recStart(taskId){
  if(rec)return;
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast('Միկրոֆոնը հասանելի չէ․ թույլատրեք այն բրաուզերում');return}
  var mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].filter(function(m){try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})[0]||'';
  var mr;
  try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('Բրաուզերը չի աջակցում ձայնագրությունը');return}
  var r={task:taskId,mr:mr,stream:stream,chunks:[],start:Date.now(),levels:[],send:false,mime:mr.mimeType||mime||'audio/webm'};
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    r.ac=new AC();var src=r.ac.createMediaStreamSource(stream);
    r.an=r.ac.createAnalyser();r.an.fftSize=512;src.connect(r.an);r.buf=new Uint8Array(r.an.fftSize);
  }catch(e){}
  mr.ondataavailable=function(e){if(e.data&&e.data.size)r.chunks.push(e.data)};
  mr.onstop=function(){recFinish(r)};
  rec=r;
  mr.start(250);
  r.timer=setInterval(recTick,100);
  render();
}
function recTick(){
  if(!rec)return;
  var r=rec,el=(Date.now()-r.start)/1000,lv=0.15;
  if(r.an){r.an.getByteTimeDomainData(r.buf);var m=0;for(var i=0;i<r.buf.length;i++){m=Math.max(m,Math.abs(r.buf[i]-128))}lv=Math.min(1,m/90)}
  r.levels.push(lv);
  var t=$('#recTime');if(t)t.textContent=fmtDur(el);
  var live=$('#recLive');
  if(live){live.innerHTML=r.levels.slice(-40).map(function(v){return '<i style="height:'+Math.max(12,Math.round(v*100))+'%"></i>'}).join('')}
  if(el>=MAX_VOICE_SEC)recStop(true);
}
function recStop(send){
  if(!rec||rec.stopping)return;
  var r=rec;r.stopping=true;r.send=send;r.dur=(Date.now()-r.start)/1000;
  clearInterval(r.timer);
  if(send){r.uploading=true;render()}
  try{r.mr.stop()}catch(e){recFinish(r)}
  r.stream.getTracks().forEach(function(t){t.stop()});
  try{if(r.ac)r.ac.close()}catch(e){}
}
async function recFinish(r){
  if(r.finished)return;r.finished=true;
  if(!r.send){rec=null;render();return}
  if(r.dur<1||!r.chunks.length){rec=null;toast('Ձայնագրությունը չափազանց կարճ է');render();return}
  var blob=new Blob(r.chunks,{type:r.mime});
  var secs=Math.max(1,Math.min(200,Math.round(r.dur)));
  var N=40,peaks=[],mx=0.05;
  r.levels.forEach(function(v){if(v>mx)mx=v});
  for(var i=0;i<N;i++){
    var a=Math.floor(i*r.levels.length/N),b=Math.max(a+1,Math.floor((i+1)*r.levels.length/N)),m=0;
    for(var j=a;j<b&&j<r.levels.length;j++)m=Math.max(m,r.levels[j]);
    peaks.push(Math.max(10,Math.round(m/mx*100)));
  }
  var ext=/mp4/.test(r.mime)?'m4a':(/ogg/.test(r.mime)?'ogg':'webm');
  var path=r.task+'/'+me.id+'/v_'+Date.now()+'.'+ext;
  var up=await sb.storage.from('files').upload(path,blob,{contentType:r.mime.split(';')[0]});
  if(up.error){rec=null;toast('Չհաջողվեց ուղարկել ձայնագրությունը');render();return}
  var ins=await sb.from('task_messages').insert({task_id:r.task,sender:me.id,body:'',audio_path:path,audio_secs:secs,audio_peaks:peaks});
  if(ins.error){try{await sb.storage.from('files').remove([path])}catch(e){}rec=null;toast('Չհաջողվեց ուղարկել');render();return}
  stickBottom[r.task]=true;rec=null;render();queueReload();
}

var audioEl=new Audio(), playing={mid:null,loading:false}, blobCache={};
audioEl.addEventListener('timeupdate',updatePlayUI);
audioEl.addEventListener('pause',updatePlayUI);
audioEl.addEventListener('play',updatePlayUI);
audioEl.addEventListener('ended',function(){playing.mid=null;updatePlayUI()});
function findMsg(mid){for(var k in msgs){var m=msgs[k].find(function(x){return String(x.id)===String(mid)});if(m)return m}return null}
function updatePlayUI(){
  screenEl.querySelectorAll('.vmsg').forEach(function(v){
    var mid=v.getAttribute('data-mid'),m=findMsg(mid);if(!m)return;
    var act=playing.mid!==null&&String(playing.mid)===mid;
    var btn=v.querySelector('.vplay'),bars=v.querySelectorAll('.wave i'),tm=v.querySelector('.vtime');
    var p=act&&m.audio_secs?Math.min(1,audioEl.currentTime/m.audio_secs):0;
    var st=act?(playing.loading?'load':(audioEl.paused?'play':'pause')):'play';
    if(btn.getAttribute('data-st')!==st){btn.setAttribute('data-st',st);btn.innerHTML=st==='play'?'<img src="icons/play.png" alt="▶">':(st==='pause'?'⏸':'…')}
    for(var i=0;i<bars.length;i++)bars[i].className=(act&&i<Math.round(p*bars.length))?'on':'';
    tm.textContent=act&&!playing.loading&&(audioEl.currentTime>0)?fmtDur(audioEl.currentTime):fmtDur(m.audio_secs);
  });
}
async function playVoice(mid){
  var m=findMsg(mid);if(!m||!m.audio_path)return;
  if(playing.mid!==null&&String(playing.mid)===String(mid)&&!playing.loading){
    if(audioEl.paused)audioEl.play().catch(function(){});else audioEl.pause();
    return;
  }
  audioEl.pause();
  playing={mid:mid,loading:true};updatePlayUI();
  var url=blobCache[m.audio_path];
  if(!url){
    var r=await sb.storage.from('files').createSignedUrl(m.audio_path,120);
    if(r.error||!r.data){playing={mid:null,loading:false};toast('Չհաջողվեց բացել ձայնագրությունը');updatePlayUI();return}
    try{var resp=await fetch(r.data.signedUrl);var bl=await resp.blob();url=URL.createObjectURL(bl);blobCache[m.audio_path]=url}
    catch(e){playing={mid:null,loading:false};toast('Չհաջողվեց բեռնել ձայնագրությունը');updatePlayUI();return}
  }
  if(String(playing.mid)!==String(mid))return;
  playing.loading=false;
  audioEl.src=url;
  audioEl.play().catch(function(){playing={mid:null,loading:false};updatePlayUI()});
}
function bindChat(card,t){

    });

      if(e.key==='Enter'&&!e.shiftKey&&!isMobile){e.preventDefault();sendText(id)}

}

  screenEl.innerHTML='<div class="center-card"><h2>📋 Առաջադրանքներ</h2><div class="sub">Demo տարբերակ․ ընտրեք դերը</div>'
   +'<button class="btn btn-primary btn-full" data-u="boss1" style="margin-bottom:10px">👔 Մուտք որպես ղեկավար (Արամ)</button>'
   +'<button class="btn btn-full" data-u="w1" style="margin-bottom:10px;background:#e8eefc;color:#2457d6">🧾 Մուտք որպես հաշվապահ Անի</button>'
   +'<button class="btn btn-full" data-u="w2" style="background:#e8eefc;color:#2457d6">🧾 Մուտք որպես հաշվապահ Մարինե</button></div>';
  screenEl.querySelectorAll('[data-u]').forEach(function(b){b.addEventListener('click',function(){demoLogin(b.getAttribute('data-u'))})});
  window.__demoUid=null;demoBar();
}
async function demoLogin(id){
  me=window.__DEMO_DB.profiles.find(function(p){return p.id===id});
  session={user:{id:id}};
  window.__demoUid=id;
  await startApp();demoBar();
}
window.__demoSwitch=function(id){if(id==='out'){doLogout();return}demoLogin(id)};
window.__demoPhone=function(){document.body.classList.toggle('phone')};
function demoBar(){
  var b=document.getElementById('demoBar');
  if(!b){b=document.createElement('div');b.id='demoBar';document.body.insertBefore(b,document.body.firstChild)}
  var u=window.__demoUid;
  function btn(id,l){return '<button onclick="__demoSwitch(\''+id+'\')" class="'+(u===id?'on':'')+'">'+l+'</button>'}
  b.innerHTML='<b>DEMO</b> '+btn('boss1','👔 Шеф')+btn('w1','🧾 Работник Ани')+btn('w2','🧾 Работник Марине')+'<button onclick="__demoPhone()">📱 вид телефона</button>';
}
demoPicker();
})();
</script>
